{% extends 'biblidoaluno/base.html' %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 400px;">
    <div class="card-header card-header-custom"><h4 class="mb-0">Acesso ao Sistema</h4></div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        <p class="mt-3 text-center mb-0">Não tem conta? <a href="{% url 'biblidoaluno:cadastro' %}">Cadastre-se</a></p>
    </div>
</div>
{% endblock %}
